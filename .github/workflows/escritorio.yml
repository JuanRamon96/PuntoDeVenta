# Compila los instaladores de la app de escritorio offline (Windows .exe y Mac .dmg) y los publica
# en una "Release" de GitHub con liga pública de descarga (la usa la landing).
# Se corre al subir una etiqueta escritorio-v* (ej. escritorio-v1.1.0) o a mano desde Actions.
name: App de escritorio

on:
  workflow_dispatch:
  push:
    tags:
      - 'escritorio-v*'

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            comando: dist:win -- --publish never
          - os: macos-latest
            comando: dist:mac -- --x64 --arm64 --publish never
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.comando }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            escritorio/dist/*.exe
            escritorio/dist/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            escritorio/dist/*.exe
            escritorio/dist/*.dmg
